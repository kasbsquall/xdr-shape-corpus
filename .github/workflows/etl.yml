name: stellar-etl replay

# Runs the corpus through stellar/stellar-etl's export code at the commit pinned in
# harness/etl/run.sh, served by the harness mock RPC over getLedgers, and fails if any entry's
# outcome differs from the committed harness/etl/results.json. A second, informational step tries
# to build stellar-etl with Go 1.27.4 on Linux (see harness/etl/README.md).

on:
  push:
    paths:
      - "corpus/**"
      - "harness/etl/**"
      - "harness/mockrpc/**"
      - ".github/workflows/etl.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "harness/etl/**"
      - "harness/mockrpc/**"
      - ".github/workflows/etl.yml"
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Corpus outcomes in stellar-etl match the committed results
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Keep the committed results and place the stellar-etl checkout
        run: |
          cp harness/etl/results.json "$RUNNER_TEMP/expected-etl-results.json"
          echo "TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - name: Replay the corpus through stellar-etl (Go 1.27.3, as stellar-etl's go.mod)
        run: bash harness/etl/run.sh
      - name: Outcomes match the committed results
        run: python harness/etl/compare_results.py "$RUNNER_TEMP/expected-etl-results.json" harness/etl/results.json
      - name: Build stellar-etl with Go 1.27.4 (informational)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/tools/src/stellar-etl
        run: GOTOOLCHAIN=go1.27.4 go build ./... 2>&1 | tail -n 20; exit "${PIPESTATUS[0]}"
