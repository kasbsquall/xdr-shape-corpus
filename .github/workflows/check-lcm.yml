name: check-lcm goldens

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-lcm:
    name: Corpus against stellar-core --check-lcm goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Build lcm-goldens (rs-stellar-xdr 30.0.0)
        run: cargo build --release --locked --manifest-path tools/lcm-goldens/Cargo.toml
      # Fetches test-lcm-current/ from stellar-core at the commit pinned in the script, and fails
      # if corpus/check-lcm.json (the source of the manifest's checkLcmGolden) differs from this run.
      - name: Goldens decode and re-encode byte-identical; committed results match
        run: python tools/check_lcm_goldens.py --check
