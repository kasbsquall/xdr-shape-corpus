name: wallet-backend ingest against Postgres

# Runs wallet-backend's own `migrate up` and `ingest` commands, at the pre-#729 and fixed
# commits (go-stellar-sdk raised to v0.8.0 on both), against TimescaleDB, with the corpus ledger
# served by harness/mockrpc over getLedgers. Fails if what is observed in the database (cursor,
# row counts, signer read-back) or in wallet-backend's logs (persist attempts, error) differs
# from the committed harness/postgres/results.json.

on:
  push:
    paths:
      - "corpus/**"
      - "harness/**"
      - ".github/workflows/harness-postgres.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "harness/**"
      - ".github/workflows/harness-postgres.yml"
  schedule:
    - cron: "57 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: "#729 halts ingestion before the fix and commits the full signer after it"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # run.sh starts its own TimescaleDB container (image pinned by digest in run.sh) with a
    # password generated for this run, no published ports and resource limits, and removes it.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.4"
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Keep the committed results; wallet-backend checkouts go to the runner's temp dir
        run: |
          cp harness/postgres/results.json "$RUNNER_TEMP/expected-postgres-results.json"
          echo "TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - name: Migrate and ingest at the pre-fix and fixed commits
        run: bash harness/postgres/run.sh
      - name: Observations match the committed results
        run: python harness/postgres/compare_results.py "$RUNNER_TEMP/expected-postgres-results.json" harness/postgres/results.json
      - name: No harness container is left
        if: always()
        run: |
          left="$(docker ps -aq --filter name=^xdrkit-pg-)"
          [ -z "$left" ] || { docker ps -a --filter name=^xdrkit-pg-; exit 1; }
