name: corpus generator (local stellar-core, both passphrases)

# Regenerates corpus entries on a local single-validator stellar-core in Docker, once under the
# testnet passphrase and once under the mainnet passphrase, and checks every regenerated entry
# against the committed one with tools/generator/compare.py. No public network is contacted;
# keys are generated at run time and never stored. The stellar-core image is pinned by digest
# in tools/generator/generate.mjs (IMAGE).

on:
  push:
    paths:
      - "corpus/**"
      - "tools/generator/**"
      - "tools/build_manifest.py"
      - "tools/package-lock.json"
      - ".github/workflows/generator.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "tools/generator/**"
      - "tools/build_manifest.py"
      - "tools/package-lock.json"
      - ".github/workflows/generator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Entries regenerate on testnet and mainnet passphrases with the committed shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Build xdr-roundtrip (rs-stellar-xdr 30.0.0)
        run: cargo build --release --locked --manifest-path tools/roundtrip/Cargo.toml
      - name: Install js-stellar-sdk from the lockfile
        working-directory: tools
        run: npm ci --no-audit --no-fund
      - name: Pull stellar-core by digest
        run: docker pull "$(node --input-type=module -e 'const m = await import("./tools/generator/generate.mjs"); console.log(m.IMAGE)')"
      - name: Extraction gives back the committed envelopes and results
        run: node tools/generator/generate.mjs --self-test
      - name: Regenerate under the testnet passphrase
        run: node tools/generator/generate.mjs --network testnet --out "$RUNNER_TEMP/regenerated"
      - name: Regenerate under the mainnet passphrase
        run: node tools/generator/generate.mjs --network mainnet --out "$RUNNER_TEMP/regenerated"
      - name: Regenerated entries carry the committed shapes and expected values
        run: python tools/generator/compare.py --out "$RUNNER_TEMP/regenerated" --json "$RUNNER_TEMP/regenerated/compare-report.json"
      - name: No generator container is left running
        if: always()
        run: test -z "$(docker ps -aq --filter name=xdr-gen-)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: regenerated-entries
          path: ${{ runner.temp }}/regenerated
          if-no-files-found: ignore
