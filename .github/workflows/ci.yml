name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    name: Corpus round trip, manifest and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build xdr-roundtrip (rs-stellar-xdr 30.0.0)
        run: cargo build --release --locked --manifest-path tools/roundtrip/Cargo.toml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18,<5"
      - name: Every corpus file decodes and re-encodes byte-identical; manifest values match the bytes
        run: python tools/build_manifest.py --check
      - name: Manifest validates against the JSON Schema; file hashes match
        run: python tools/check_schema.py

  linter:
    name: xdrlint tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linter
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: linter/go.mod
          cache-dependency-path: linter/go.sum
      - run: go vet ./...
      - run: go test ./...

  mockrpc:
    name: Replay harness mock RPC (getLedgers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness/mockrpc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: harness/mockrpc/go.mod
          cache-dependency-path: harness/mockrpc/go.sum
      - run: go vet ./...
      - run: go test ./...

  conformance:
    name: Conformance runner (JS, Go, Rust, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: conformance/go/go.mod
          cache-dependency-path: conformance/go/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: JS SDK 17.2.0, 17.2.1 and 17.4.0
        run: |
          for v in 17.2.0 17.2.1 17.4.0; do
            (cd conformance/js/sdk-$v && npm ci --no-audit --no-fund)
            node conformance/js/run.mjs conformance/js/sdk-$v conformance/results/js-$v.json
          done
      - name: Go SDK v0.9.0
        working-directory: conformance/go
        run: go run . ../.. ../results/go-v0.9.0.json
      - name: Rust stellar-xdr 30.0.0
        run: |
          cargo build --release --locked --manifest-path tools/roundtrip/Cargo.toml
          cargo build --release --locked --manifest-path conformance/rust/Cargo.toml
          python conformance/rust.py conformance/results/rust-30.0.0.json
      - name: Python stellar-sdk 17.0.1
        run: |
          pip install -r conformance/python/requirements.txt
          python conformance/python/run.py conformance/results/python-17.0.1.json
      - name: py-stellar-xdr 0.2.0
        run: |
          pip install -r conformance/python-xdr/requirements.txt
          python conformance/python-xdr/run.py conformance/results/python-xdr-0.2.0.json
      - name: Divergence matrix and expectations
        run: python conformance/matrix.py
